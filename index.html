<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff7fb">
<title>宝宝的表情包小屋</title>

<style>
:root {
  --pink: #f4b5d2;
  --text: #574653;
  --muted: #a99aa5;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  color: var(--text);
  background: linear-gradient(
    180deg,
    #fff2f8,
    #ffffff 55%,
    #fff7fb
  );
  font-family: -apple-system, BlinkMacSystemFont,
    "PingFang SC", "Microsoft YaHei", sans-serif;
}

header {
  padding: 42px 18px 28px;
  text-align: center;
}

.eyebrow {
  color: #c17ca4;
  font-size: 11px;
  letter-spacing: 3px;
}

h1 {
  font-size: 27px;
  margin: 14px 0 9px;
}

.subtitle {
  font-size: 14px;
  color: var(--muted);
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 0 15px 35px;
}

.search {
  width: 100%;
  padding: 17px;
  border: 1px solid #f1dce8;
  border-radius: 20px;
  background: white;
  font-size: 16px;
  outline: none;
  color: var(--text);
}

.search:focus {
  border-color: var(--pink);
}

.filters {
  display: flex;
  gap: 9px;
  overflow-x: auto;
  padding: 15px 0;
}

.filters button {
  flex-shrink: 0;
  border: 1px solid #f1dce8;
  background: white;
  border-radius: 30px;
  padding: 10px 17px;
  color: #887383;
  font-size: 14px;
}

.filters button.active {
  background: #fce3ef;
  color: #a34f7c;
  border-color: #f4c5dc;
}

.count {
  font-size: 13px;
  color: var(--muted);
  margin: 7px 2px 16px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
}

.card {
  min-width: 0;
  padding: 9px;
  border: 1px solid #f5e7ef;
  border-radius: 20px;
  background: rgba(255,255,255,.96);
  box-shadow: 0 5px 18px #a8799010;
}

.card img {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: contain;
  background: #fffafd;
  border-radius: 14px;
}

.name {
  font-size: 14px;
  margin: 12px 2px 8px;
  font-weight: 600;
  overflow-wrap: anywhere;
}

.filename {
  color: var(--muted);
  font-size: 11px;
  overflow-wrap: anywhere;
  margin: 0 2px 11px;
}

.actions {
  display: flex;
  gap: 6px;
}

.actions a,
.actions button {
  flex: 1;
  min-width: 0;
  text-align: center;
  padding: 10px 3px;
  border: 0;
  border-radius: 12px;
  background: #fce8f3;
  color: #9e527b;
  text-decoration: none;
  font-size: 12px;
}

.actions button {
  background: #f3eff3;
  color: #756775;
}

.empty {
  display: none;
  text-align: center;
  padding: 35px 5px;
  color: var(--muted);
  font-size: 14px;
}

footer {
  text-align: center;
  color: #b3a2af;
  font-size: 12px;
  padding: 28px 0 8px;
}

@media (min-width: 620px) {
  .grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 17px;
  }
}
</style>
</head>

<body>
<header>
  <div class="eyebrow">MY LITTLE STICKER COLLECTION</div>
  <h1>宝宝的表情包小屋</h1>
  <div class="subtitle">把喜欢的可爱，统统收藏起来。</div>
</header>

<main class="container">
  <input
    id="search"
    class="search"
    type="search"
    placeholder="搜索表情包……"
  >

  <nav class="filters">
    <button class="active" data-filter="all">全部收藏</button>
    <button data-filter="cute">可爱收藏</button>
    <button data-filter="other">其他收藏</button>
  </nav>

  <div class="count" id="count">正在加载图片……</div>
  <section class="grid" id="grid"></section>
  <div class="empty" id="empty"></div>

  <footer>Made with love · 宝宝的表情包小屋</footer>
</main>

<script>
const API_URL =
  "https://api.github.com/repos/jswooy-oss/stickers/contents/";

const IMAGE_BASE =
  "https://raw.githubusercontent.com/jswooy-oss/stickers/main/";

const grid = document.getElementById("grid");
const search = document.getElementById("search");
const count = document.getElementById("count");
const empty = document.getElementById("empty");

let files = [];
let currentFilter = "all";

async function loadFiles() {
  count.textContent = "正在加载表情包……";
  empty.style.display = "none";

  try {
    const response = await fetch(API_URL, {
      headers: {
        Accept: "application/vnd.github+json"
      }
    });

    if (!response.ok) {
      throw new Error("无法读取仓库");
    }

    const entries = await response.json();

    files = entries
      .filter(item =>
        item.type === "file" &&
        /\.(png|jpe?g|gif|webp|avif)$/i.test(item.name)
      )
      .map(item => ({
        name: item.name.replace(/\.[^.]+$/, "")
          .replace(/[_-]+/g, " "),
        file: item.name,
        category: "cute"
      }));

    render();
  } catch (error) {
    count.textContent = "图片列表暂时无法加载";
    empty.textContent =
      "请检查网络，稍后刷新页面再试。";
    empty.style.display = "block";
  }
}

function render() {
  const keyword = search.value.trim().toLowerCase();

  const result = files.filter(item => {
    const matchesFilter =
      currentFilter === "all" ||
      item.category === currentFilter;

    const matchesSearch =
      (item.name + " " + item.file)
        .toLowerCase()
        .includes(keyword);

    return matchesFilter && matchesSearch;
  });

  grid.innerHTML = "";

  result.forEach(item => {
    const url = IMAGE_BASE +
      item.file.split("/").map(encodeURIComponent).join("/");

    const card = document.createElement("article");
    card.className = "card";

    const img = document.createElement("img");
    img.src = url;
    img.alt = item.name;
    img.loading = "lazy";

    img.onerror = () => {
      img.alt = "图片加载失败";
    };

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = item.name;

    const filename = document.createElement("div");
    filename.className = "filename";
    filename.textContent = item.file;

    const actions = document.createElement("div");
    actions.className = "actions";

    const view = document.createElement("a");
    view.href = url;
    view.target = "_blank";
    view.rel = "noopener noreferrer";
    view.textContent = "查看原图";

    const copy = document.createElement("button");
    copy.type = "button";
    copy.textContent = "复制链接";

    copy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(url);
        copy.textContent = "复制成功";
      } catch {
        window.prompt("请长按复制图片链接：", url);
      }

      setTimeout(() => {
        copy.textContent = "复制链接";
      }, 1500);
    });

    actions.append(view, copy);
    card.append(img, name, filename, actions);
    grid.appendChild(card);
  });

  count.textContent = "找到 " + result.length + " 张图片";

  if (result.length === 0) {
    empty.textContent = keyword
      ? "没有找到图片，换个关键词试试吧。"
      : "仓库里还没有图片哦。";
    empty.style.display = "block";
  } else {
    empty.style.display = "none";
  }
}

document.querySelectorAll("[data-filter]").forEach(button => {
  button.addEventListener("click", () => {
    currentFilter = button.dataset.filter;

    document.querySelectorAll("[data-filter]").forEach(item => {
      item.classList.toggle("active", item === button);
    });

    render();
  });
});

search.addEventListener("input", render);

loadFiles();
</script>
</body>
  </html>
